# go-mumble-server bootstrap configuration
#
# This file is used for initial seeding only. On first run, values from this file
# are written to the SQLite database. After that, runtime settings are managed via
# the REST API (GET/PATCH /api/v1/meta/config, /api/v1/servers/:id/config) or the
# web management UI. Bootstrap/runtime infrastructure fields such as database,
# TLS, logging, frontend-embed, and external identity authority settings remain
# process-level configuration in this file.

[network]
# Mumble protocol port (TCP + UDP)
port = 64738
# REST management API port
rest_port = 64730
# Bind address
host = "0.0.0.0"

[tls]
# TLS certificate and key (PEM format)
# If not set, a self-signed certificate is generated on first run
# cert = "/etc/go-mumble-server/mumble-server.crt"
# key = "/etc/go-mumble-server/mumble-server.key"

[server]
# Maximum concurrent users (0 = unlimited)
max_users = 100
# Maximum bandwidth per user in bits/sec
max_bandwidth = 72000
# Server welcome message (HTML)
welcome_text = ""
# Server password (empty = no password)
server_password = ""
# Mumble 1.4+ channel listening caps (0 = unlimited)
# max_listeners_per_channel = 0
# max_listeners_per_user = 0

[database]
# SQLite database path
path = "mumble-server.sqlite"

[logging]
# Log level: debug, info, warn, error
level = "info"

[channels]
# Maximum channel nesting depth
nesting_limit = 10
# Maximum total channels
count_limit = 1000

[users]
# Default channel ID for new connections
default_channel = 0
# Require client certificates
cert_required = false

[bonjour]
# Enable mDNS/Bonjour LAN discovery
enabled = false
# Display name for LAN discovery
register_name = "go-mumble-server"

[auth]
# local 用于独立部署；external 用于外部身份提供者，且不会回退本地认证。
mode = "local"
external_url = ""
# Provider endpoint 路径可独立配置，不与某个身份系统的路由结构绑定。
authenticate_path = "/api/internal/mumble/v1/authenticate"
resolve_path = "/api/internal/mumble/v1/identities/resolve"
service_token = ""
server_instance_id = "voice-server-01"
timeout_ms = 1500
revalidate_interval_seconds = 45
stale_grace_seconds = 180
# 生产环境推荐配置私有 CA 和 mTLS 客户端证书。
ca_cert = ""
client_cert = ""
client_key = ""
# 外部身份服务调用在线重验入口时使用，必须与 service_token 不同。
identity_revalidate_token = ""
[distributed]
# 运行模式：standalone（单进程完整服务）、core（standalone + 远端 Edge 接入能力）、
# edge（边缘进程，无本地数据库，所有权威决策转发给 core_address 指定的 Core）。
# edge 模式必须提供 core_address 与 edge_id，否则启动失败。
mode = "standalone"
# core 模式：远端 Edge 的 mTLS 接入监听地址。
# edge_listen = "0.0.0.0:64740"
# edge_tls_cert = "/etc/go-mumble-server/core-edge.crt"
# edge_tls_key = "/etc/go-mumble-server/core-edge.key"
# edge_client_ca = "/etc/go-mumble-server/edge-ca.crt"
# edge 模式：权威 Core 的地址，必填（host:port）。
# core_address = "10.0.0.1:64740"
# edge 模式：本 Edge 实例 ID，必填。
# edge_id = "edge-01"
# edge 模式：验证 Core 身份的 CA、客户端证书与私钥。
# core_ca_cert = "/etc/go-mumble-server/core-ca.crt"
# client_cert = "/etc/go-mumble-server/edge-01.crt"
# client_key = "/etc/go-mumble-server/edge-01.key"
# core_server_name = "core.example.internal"
# 心跳超时必须大于心跳间隔。
heartbeat_interval_seconds = 5
heartbeat_timeout_seconds = 15
reconnect_min_ms = 250
reconnect_max_ms = 5000
queue_size = 256
